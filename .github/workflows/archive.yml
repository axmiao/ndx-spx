name: Daily Snapshot Archive

on:
  schedule:
    # 美股收盘后：UTC 22:00（夏令时约对应美东 18:00，收盘后有余量）
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run archive script
        run: node scripts/archive.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/archive/
          git diff --staged --quiet || git commit -m "data: archive $(date -u +%F)"
          git push